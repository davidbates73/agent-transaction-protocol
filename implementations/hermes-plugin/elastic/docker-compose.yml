# Hermes ATP reporting stack for us-solebay: single-node Elasticsearch + Kibana.
#
#   * Free Basic license only (built-in users, roles, TLS). No ML, Watcher, alerting or SSO,
#     nothing that needs a trial. No Logstash: the exporter writes straight to the _bulk API.
#   * Security on everywhere: TLS on the HTTP and transport layers (self-signed CA generated
#     by the `setup` service into ./certs), no anonymous access.
#   * All credentials come from .env (see .env.example). .env and ./certs are gitignored.
#
#   cp .env.example .env && chmod 600 .env && $EDITOR .env
#   docker compose up -d          # setup creates certs, roles, users, template, dashboard
#   docker compose logs -f setup  # ends with "setup complete"
#
# See README.md (stand-up, exporter, Network section).

name: ${COMPOSE_PROJECT_NAME:-hermes-atp}

x-es-image: &es-image docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?set STACK_VERSION in .env}

services:
  setup:
    image: *es-image
    user: "0"
    command: ["bash", "/setup/setup.sh"]
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs
      - ./setup:/setup:ro
      - ./kibana:/kibana:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      HERMES_EXPORTER_PASSWORD: ${HERMES_EXPORTER_PASSWORD:?set HERMES_EXPORTER_PASSWORD in .env}
      HERMES_VIEWER_PASSWORD: ${HERMES_VIEWER_PASSWORD:?set HERMES_VIEWER_PASSWORD in .env}
      ES_PUBLIC_HOSTNAME: ${ES_PUBLIC_HOSTNAME:-}
      ES_PUBLIC_IP: ${ES_PUBLIC_IP:-}
      KIBANA_PUBLIC_HOSTNAME: ${KIBANA_PUBLIC_HOSTNAME:-}
      ES_URL: https://es01:9200
      KIBANA_URL: https://kibana:5601
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/.ready ]"]
      interval: 2s
      timeout: 5s
      retries: 120
    mem_limit: 512m

  es01:
    image: *es-image
    depends_on:
      setup:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs:ro
      - esdata:/usr/share/elasticsearch/data
    ports:
      # The ONLY port the Hermes host needs. Bind it to us-solebay's LAN address, not 0.0.0.0.
      - "${ES_BIND_ADDR:?set ES_BIND_ADDR in .env}:9200:9200"
    environment:
      node.name: es01
      cluster.name: ${CLUSTER_NAME:-hermes-atp}
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      bootstrap.memory_lock: "true"
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/es01/es01.key
      xpack.security.http.ssl.certificate: certs/es01/es01.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: certs/es01/es01.key
      xpack.security.transport.ssl.certificate: certs/es01/es01.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.destructive_requires_name: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    mem_limit: ${ES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:?set STACK_VERSION in .env}
    depends_on:
      es01:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./certs:/usr/share/kibana/config/certs:ro
      - kibanadata:/usr/share/kibana/data
    ports:
      # Admin/viewer UI. Keep it on localhost or a management network; NOT reachable from the
      # Hermes VLAN (see README "Network").
      - "${KIBANA_BIND_ADDR:-127.0.0.1}:5601:5601"
    environment:
      SERVERNAME: kibana
      SERVER_HOST: 0.0.0.0
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: config/certs/kibana/kibana.crt
      SERVER_SSL_KEY: config/certs/kibana/kibana.key
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-https://localhost:5601}
      ELASTICSEARCH_HOSTS: https://es01:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: config/certs/ca/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      NEWSFEED_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=${KIBANA_HEAP_MB:-1024}
    mem_limit: ${KIBANA_MEM_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --cacert config/certs/ca/ca.crt https://localhost:5601/api/status | grep -qE '^(200|401)$'"]
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  esdata:
  kibanadata:
