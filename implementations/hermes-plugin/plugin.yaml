name: atp-recorder
version: 0.2.0
description: Observe-only recorder that writes every Hermes main-loop API request/response/error and tool call as a signed ATP (draft-bates-atp) record, linking subagent sessions to their parent, to a local append-only JSONL log.
license: BSD-3-Clause
homepage: https://github.com/davidbates73/agent-transaction-protocol
provides_tools: []
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
